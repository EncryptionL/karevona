syntax = "proto3";

package karevona.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Events say "something happened". They are not commands and not the
// source of truth for cluster state (see ADR 0004).
service EventService {
  // Recent events from the in-process bus ring; not a durable log.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // Live stream of events matching a filter.
  rpc StreamEvents(StreamEventsRequest) returns (stream Event);
}

message TraceContext {
  string trace_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
}

message Event {
  string event_id = 1;
  string type = 2;      // PascalCase, e.g. "NodeRegistered"
  string source = 3;    // id of the object the event concerns
  google.protobuf.Timestamp timestamp = 4;
  google.protobuf.Struct payload = 5;
  TraceContext trace = 6;
  uint32 schema_version = 7;
}

message ListEventsRequest {
  string type_filter = 1;  // exact type, "*" or trailing-star prefix
  uint32 limit = 2;
}
message ListEventsResponse {
  repeated Event events = 1;
}

message StreamEventsRequest {
  string type_filter = 1;
}
