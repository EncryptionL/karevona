syntax = "proto3";

package karevona.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Shared vocabulary for all Karevona services.
//
// Contract rules (see docs/architecture/api.md):
//  * public messages are provider-neutral; no vendor wire models.
//  * mutating RPCs accept RequestMeta.idempotency_key.
//  * long-running mutations return a TaskRef, never block.
//  * enums reserve 0 for *_UNSPECIFIED; new values are append-only.

enum Architecture {
  ARCHITECTURE_UNSPECIFIED = 0;
  ARCHITECTURE_X86 = 1;
  ARCHITECTURE_X86_64 = 2;
  ARCHITECTURE_ARM = 3;
  ARCHITECTURE_AARCH64 = 4;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_CLUSTER = 1;
  RESOURCE_KIND_NODE = 2;
  RESOURCE_KIND_PROVIDER = 3;
  RESOURCE_KIND_VM = 4;
  RESOURCE_KIND_CONTAINER = 5;
  RESOURCE_KIND_VOLUME = 6;
  RESOURCE_KIND_STORAGE_POOL = 7;
  RESOURCE_KIND_SNAPSHOT = 8;
  RESOURCE_KIND_BACKUP = 9;
  RESOURCE_KIND_NETWORK = 10;
  RESOURCE_KIND_NIC = 11;
  RESOURCE_KIND_INCIDENT = 12;
  RESOURCE_KIND_POLICY = 13;
  RESOURCE_KIND_SCANNER = 14;
  RESOURCE_KIND_AI_PROVIDER = 15;
}

// Namespaced capability names, e.g. "compute.vm.live_migration".
message CapabilitySet {
  repeated string names = 1;
}

// Metadata every mutating request may carry.
message RequestMeta {
  string request_id = 1;       // correlation id; generated by the server when empty
  string idempotency_key = 2;  // repeated calls with the same key return the original task
}

// Returned by long-running mutations. Progress is observed via TaskService.
message TaskRef {
  string task_id = 1;
}

message PageRequest {
  uint32 page_size = 1;
  string page_token = 2;
}

message PageInfo {
  string next_page_token = 1;  // empty when there are no more results
}

// Generic resource envelope (see docs/architecture/resource-model.md).
message Resource {
  string id = 1;
  ResourceKind kind = 2;
  string name = 3;
  string provider_id = 4;
  Architecture architecture = 5;
  map<string, string> labels = 6;
  CapabilitySet capabilities = 7;
  google.protobuf.Struct attributes = 8;
  uint64 version = 9;
  google.protobuf.Timestamp updated_at = 10;
}
